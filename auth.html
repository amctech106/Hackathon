<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Authentication — HackStarter</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="auth-page">

  <!-- Animated Aurora Background -->
  <div class="bg-aurora" aria-hidden="true">
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
    <div class="orb orb-3"></div>
  </div>

  <div class="auth-wrapper">
    <div class="auth-brand">
      <a href="index.html" class="brand-logo" style="justify-content: center; margin-bottom: 0.5rem;">
        <span class="brand-icon"><i class="fa-solid fa-bolt"></i></span>
        <span>HackStarter</span>
      </a>
      <p class="text-muted" style="font-size: 0.9rem;">Welcome! Sign in or create an account.</p>
    </div>

    <div class="auth-card">
      <div class="auth-tabs" role="tablist">
        <button type="button" class="auth-tab-btn active" data-tab="signin">
          <i class="fa-solid fa-right-to-bracket"></i> Sign In
        </button>
        <button type="button" class="auth-tab-btn" data-tab="signup">
          <i class="fa-solid fa-user-plus"></i> Sign Up
        </button>
      </div>

      <!-- SIGN IN -->
      <div id="signin-form-wrapper">
        <form id="signin-form" autocomplete="on">
          <div class="form-group">
            <label class="form-label" for="signin-email">Email Address</label>
            <div class="input-icon-wrapper">
              <i class="fa-regular fa-envelope input-icon"></i>
              <input type="email" id="signin-email" class="form-input" placeholder="you@example.com" required autocomplete="email">
            </div>
          </div>
          <div class="form-group">
            <label class="form-label" for="signin-password">Password</label>
            <div class="input-icon-wrapper">
              <i class="fa-solid fa-lock input-icon"></i>
              <input type="password" id="signin-password" class="form-input" placeholder="••••••••" required autocomplete="current-password">
              <button type="button" class="password-toggle-btn" aria-label="Toggle password visibility"><i class="fa-regular fa-eye"></i></button>
            </div>
          </div>
          <div class="form-meta">
            <label class="form-check"><input type="checkbox" id="remember-me" checked><span>Remember me</span></label>
            <a href="#" id="forgot-password-link">Forgot password?</a>
          </div>
          <button type="submit" class="btn btn-primary btn-block">Sign In</button>
        </form>
        <p class="form-footer-text">Don't have an account? <a href="#" data-switch-to="signup" style="font-weight: 600;">Sign up</a></p>
      </div>

      <!-- SIGN UP -->
      <div id="signup-form-wrapper" class="hidden">
        <form id="signup-form" autocomplete="on">
          <div class="form-group">
            <label class="form-label" for="signup-name">Full Name</label>
            <div class="input-icon-wrapper">
              <i class="fa-regular fa-user input-icon"></i>
              <input type="text" id="signup-name" class="form-input" placeholder="Ali Khan" required autocomplete="name">
            </div>
          </div>
          <div class="form-group">
            <label class="form-label" for="signup-email">Email Address</label>
            <div class="input-icon-wrapper">
              <i class="fa-regular fa-envelope input-icon"></i>
              <input type="email" id="signup-email" class="form-input" placeholder="you@example.com" required autocomplete="email">
            </div>
          </div>
          <div class="form-group">
            <label class="form-label" for="signup-password">Password</label>
            <div class="input-icon-wrapper">
              <i class="fa-solid fa-lock input-icon"></i>
              <input type="password" id="signup-password" class="form-input" placeholder="Minimum 6 characters" minlength="6" required autocomplete="new-password">
              <button type="button" class="password-toggle-btn" aria-label="Toggle password visibility"><i class="fa-regular fa-eye"></i></button>
            </div>
          </div>
          <div class="form-group">
            <label class="form-label" for="signup-confirm-password">Confirm Password</label>
            <div class="input-icon-wrapper">
              <i class="fa-solid fa-shield-halved input-icon"></i>
              <input type="password" id="signup-confirm-password" class="form-input" placeholder="Re-enter your password" minlength="6" required autocomplete="new-password">
            </div>
          </div>
          <button type="submit" class="btn btn-primary btn-block">Create Account</button>
        </form>
        <p class="form-footer-text">Already have an account? <a href="#" data-switch-to="signin" style="font-weight: 600;">Sign in</a></p>
      </div>
    </div>

    <div class="text-center" style="margin-top: 1.5rem;">
      <a href="index.html" class="text-muted" style="font-size: 0.88rem;">
        <i class="fa-solid fa-arrow-left"></i> Back to Homepage
      </a>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/config.js"></script>
  <script src="js/supabaseClient.js"></script>
  <script src="js/toast.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
