<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Account — HackStarter</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="auth-page">

  <!-- Animated Aurora Background -->
  <div class="bg-aurora" aria-hidden="true">
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
    <div class="orb orb-3"></div>
  </div>

  <div class="auth-wrapper">
    <!-- Brand -->
    <div class="auth-brand">
      <a href="index.html" class="brand-logo" style="justify-content: center; margin-bottom: 0.5rem;">
        <span class="brand-icon"><i class="fa-solid fa-bolt"></i></span>
        <span>HackStarter</span>
      </a>
    </div>

    <!-- Auth Card -->
    <div class="auth-card">
      <h2 class="auth-heading">
        <i class="fa-solid fa-user-plus text-primary"></i> Create Your Account
      </h2>
      <p class="auth-subtext">Join in seconds — completely free</p>

      <!-- Social Buttons -->
      <div class="social-row">
        <button type="button" class="social-btn" onclick="Toast.info('Supabase OAuth config required for Google signup.')">
          <i class="fa-brands fa-google"></i> Google
        </button>
        <button type="button" class="social-btn" onclick="Toast.info('Supabase OAuth config required for GitHub signup.')">
          <i class="fa-brands fa-github"></i> GitHub
        </button>
      </div>

      <div class="divider-or">or sign up with email</div>

      <!-- Sign Up Form -->
      <form id="signup-form" autocomplete="on">
        <div class="form-group">
          <label class="form-label" for="signup-name">Full Name</label>
          <div class="input-icon-wrapper">
            <i class="fa-regular fa-user input-icon"></i>
            <input type="text" id="signup-name" class="form-input" 
                   placeholder="Ali Khan" required autocomplete="name">
          </div>
        </div>

        <div class="form-group">
          <label class="form-label" for="signup-email">Email Address</label>
          <div class="input-icon-wrapper">
            <i class="fa-regular fa-envelope input-icon"></i>
            <input type="email" id="signup-email" class="form-input" 
                   placeholder="you@example.com" required autocomplete="email">
          </div>
        </div>

        <div class="form-group">
          <label class="form-label" for="signup-password">Password</label>
          <div class="input-icon-wrapper">
            <i class="fa-solid fa-lock input-icon"></i>
            <input type="password" id="signup-password" class="form-input" 
                   placeholder="Minimum 6 characters" minlength="6" required autocomplete="new-password">
            <button type="button" class="password-toggle-btn" aria-label="Toggle password visibility">
              <i class="fa-regular fa-eye"></i>
            </button>
          </div>
        </div>

        <div class="form-group">
          <label class="form-label" for="signup-confirm-password">Confirm Password</label>
          <div class="input-icon-wrapper">
            <i class="fa-solid fa-shield-halved input-icon"></i>
            <input type="password" id="signup-confirm-password" class="form-input" 
                   placeholder="Re-enter your password" minlength="6" required autocomplete="new-password">
          </div>
        </div>

        <button type="submit" class="btn btn-primary btn-block" style="padding: 0.8rem;">
          <i class="fa-solid fa-rocket"></i> Create Account
        </button>
      </form>

      <p class="form-footer-text">
        Already have an account?
        <a href="login.html" style="font-weight: 600;">Sign in →</a>
      </p>

      <div class="secure-badge">
        <i class="fa-solid fa-shield-halved"></i>
        <span>Your data is encrypted and stored securely via Supabase</span>
      </div>
    </div>

    <!-- Back to home -->
    <div class="text-center" style="margin-top: 1.5rem;">
      <a href="index.html" class="text-muted" style="font-size: 0.88rem;">
        <i class="fa-solid fa-arrow-left"></i> Back to Homepage
      </a>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/config.js"></script>
  <script src="js/supabaseClient.js"></script>
  <script src="js/toast.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
