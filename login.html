<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In — HackStarter</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="auth-page">

  <!-- Animated Aurora Background -->
  <div class="bg-aurora" aria-hidden="true">
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
    <div class="orb orb-3"></div>
  </div>

  <div class="auth-wrapper">
    <!-- Brand -->
    <div class="auth-brand">
      <a href="index.html" class="brand-logo" style="justify-content: center; margin-bottom: 0.5rem;">
        <span class="brand-icon"><i class="fa-solid fa-bolt"></i></span>
        <span>HackStarter</span>
      </a>
    </div>

    <!-- Auth Card -->
    <div class="auth-card">
      <h2 class="auth-heading">
        <i class="fa-solid fa-right-to-bracket text-primary"></i> Welcome Back
      </h2>
      <p class="auth-subtext">Sign in to continue to your dashboard</p>

      <!-- Social Buttons (visual — hook to Supabase OAuth later) -->
      <div class="social-row">
        <button type="button" class="social-btn" onclick="Toast.info('Supabase OAuth config required for Google login.')">
          <i class="fa-brands fa-google"></i> Google
        </button>
        <button type="button" class="social-btn" onclick="Toast.info('Supabase OAuth config required for GitHub login.')">
          <i class="fa-brands fa-github"></i> GitHub
        </button>
      </div>

      <div class="divider-or">or continue with email</div>

      <!-- Sign In Form -->
      <form id="signin-form" autocomplete="on">
        <div class="form-group">
          <label class="form-label" for="signin-email">Email Address</label>
          <div class="input-icon-wrapper">
            <i class="fa-regular fa-envelope input-icon"></i>
            <input type="email" id="signin-email" class="form-input" 
                   placeholder="you@example.com" required autocomplete="email">
          </div>
        </div>

        <div class="form-group">
          <label class="form-label" for="signin-password">Password</label>
          <div class="input-icon-wrapper">
            <i class="fa-solid fa-lock input-icon"></i>
            <input type="password" id="signin-password" class="form-input" 
                   placeholder="••••••••" required autocomplete="current-password">
            <button type="button" class="password-toggle-btn" aria-label="Toggle password visibility">
              <i class="fa-regular fa-eye"></i>
            </button>
          </div>
        </div>

        <div class="form-meta">
          <label class="form-check">
            <input type="checkbox" id="remember-me" checked>
            <span>Remember me</span>
          </label>
          <a href="#" id="forgot-password-link">Forgot password?</a>
        </div>

        <button type="submit" class="btn btn-primary btn-block" style="padding: 0.8rem;">
          <i class="fa-solid fa-arrow-right"></i> Sign In
        </button>
      </form>

      <p class="form-footer-text">
        Don't have an account?
        <a href="signup.html" style="font-weight: 600;">Create one free →</a>
      </p>

      <div class="secure-badge">
        <i class="fa-solid fa-lock"></i>
        <span>Secured by Supabase Auth with AES-256 encryption</span>
      </div>
    </div>

    <!-- Back to home -->
    <div class="text-center" style="margin-top: 1.5rem;">
      <a href="index.html" class="text-muted" style="font-size: 0.88rem;">
        <i class="fa-solid fa-arrow-left"></i> Back to Homepage
      </a>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/config.js"></script>
  <script src="js/supabaseClient.js"></script>
  <script src="js/toast.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
